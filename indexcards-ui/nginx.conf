upstream docker-web {
     server backend:8080;
 }
 server {
   include /etc/nginx/extra-conf.d/*.conf;

   listen 80;
   server_name frontend;

   # Vulnerability scanners probe for secrets (.env, .aws/credentials, /proc/self/environ, ...). The SPA fallback would
   # answer them with index.html and a 200, which invites more probing. 444 closes the connection without a response.
   location ~ /\.(?!well-known/) {
    return 444;
   }
   location ~* ^/(etc|proc|root|home|config|backend|app|aws)/ {
    return 444;
   }
   location ~* \.(env|ini|ya?ml|php\d?|aspx?|jsp|cgi|sh|sql|bak|old|git|local)$ {
    return 444;
   }
   location ~* ^/(claude|mcp|aws|appsettings[^/]*)\.json$ {
    return 444;
   }

   location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri $uri/ /index.html =404;
   }


   location /api/ {
      proxy_pass http://backendcontainer:8080;
      # In our case Container name is as we setup in docker-compose `demo` and port 8080
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
  }
}
