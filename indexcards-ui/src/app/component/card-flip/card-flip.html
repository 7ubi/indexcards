<div
  class="card-flip"
  [class.flipped]="showAnswer"
  [class.no-transition]="skipTransition"
  role="button"
  tabindex="0"
  [attr.aria-pressed]="showAnswer"
  (click)="toggleAnswer()"
  (keydown.enter)="toggleAnswer()"
  (keydown.space)="toggleAnswer()"
>
  <div class="card-face card-front">
    <span class="card-label">{{ 'indexcard.question' | translate }}</span>
    <div class="indexcard-text" [innerHTML]="question | markdownMath" appMathjax></div>
    <span class="card-hint">{{ 'indexcard.tap_to_reveal' | translate }}</span>
  </div>

  <div class="card-face card-back">
    <span class="card-label">{{ 'indexcard.answer' | translate }}</span>
    <div class="indexcard-text" [innerHTML]="answer | markdownMath" appMathjax></div>
  </div>
</div>
