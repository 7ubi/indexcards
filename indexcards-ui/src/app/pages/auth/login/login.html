<div class="center">
  <div class="form-container">
    <h1 class="full-width centering">{{ 'auth.login' | translate }}</h1>
    <p class="full-width centering">{{ 'auth.login_hint' | translate }}</p>
    <button matButton="filled" type="button" (click)="login()">
      <mat-icon>login</mat-icon>
      {{ 'auth.login_button' | translate }}
    </button>
    <p class="full-width centering">
      {{ 'privacy.signup_notice' | translate }}
      <a routerLink="/privacy">{{ 'privacy.signup_notice_link' | translate }}</a
      >.
    </p>
  </div>
</div>
