<div class="quiz-page">
  @if (loading) {
    <app-loading-spinner />
  } @else {
    <div class="quiz-content">
      <app-card-flip
        [question]="getIndexCard()?.question"
        [answer]="getIndexCard()?.answer"
        [showAnswer]="showAnswer"
        (showAnswerChange)="showAnswer = $event"
      />
    </div>

    <div class="assessment-buttons">
      <button
        matButton="filled"
        class="assessment-bad"
        type="button"
        (click)="assessIndexCard('BAD')"
      >
        {{ 'bad' | translate }}
      </button>
      <button
        matButton="filled"
        class="assessment-ok"
        type="button"
        (click)="assessIndexCard('OK')"
      >
        {{ 'ok' | translate }}
      </button>
      <button
        matButton="filled"
        class="assessment-good"
        type="button"
        (click)="assessIndexCard('GOOD')"
      >
        {{ 'good' | translate }}
      </button>
    </div>
  }
</div>
