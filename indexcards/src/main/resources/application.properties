# Local development: read the git-ignored .env next to docker-compose.yml (e.g. AUTHENTIK_API_TOKEN), whether the app
# is started from the repository root or from indexcards/. Missing files are ignored (Docker passes real env vars).
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
# Schema is managed by Flyway (src/main/resources/db/migration); Hibernate only checks it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
# Databases that existed before Flyway was introduced are marked as V1 (baseline) instead of running it.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/indexcardsdb
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.main.allow-bean-definition-overriding=true
# Login happens at Authentik (OIDC, Google as source); the backend only validates Authentik's access tokens.
# Issuer as seen by the browser; must match the tokens' `iss` claim (with trailing slash).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTHENTIK_ISSUER:http://localhost:9000/application/o/indexcards/}
# Signing keys are fetched from here (inside Docker Compose: Authentik's internal address).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTHENTIK_JWKS_URI:http://localhost:9000/application/o/indexcards/jwks/}
# Only accept tokens issued for this app.
spring.security.oauth2.resourceserver.jwt.audiences=${AUTHENTIK_CLIENT_ID:indexcards}
# Public OIDC client id the frontend uses (served by GET /api/auth/config).
app.auth.client-id=${AUTHENTIK_CLIENT_ID:indexcards}
# Authentik API: deletes the Authentik user when an account is deleted (inside Docker Compose: internal address).
app.authentik.api-url=${AUTHENTIK_API_URL:http://localhost:9000/api/v3}
# Token of the service account "indexcards-backend" from the blueprint; may only view and delete users.
app.authentik.api-token=${AUTHENTIK_API_TOKEN:}

# Image upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.images.storage-path=${IMAGES_STORAGE_PATH:./data/images}
# Members of this Authentik group (access token claim "groups") are made admins on their next request
app.admin.group=indexcards-admins