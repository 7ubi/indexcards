# Schema is managed by Flyway (src/main/resources/db/migration); Hibernate only checks it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
# Databases that existed before Flyway was introduced are marked as V1 (baseline) instead of running it.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/indexcardsdb
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.main.allow-bean-definition-overriding=true
# App Properties
# Base64-encoded HS512 key (>= 64 bytes), e.g. `openssl rand -base64 64 | tr -d '\n'`. If unset, a random key is
# generated at startup (tokens are then invalidated on every restart).
bezkoder.app.jwtSecret=${JWT_SECRET:}
bezkoder.app.jwtExpirationMs=86400000

# Image upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.images.storage-path=${IMAGES_STORAGE_PATH:./data/images}
# Comma-separated usernames that are made admins on startup (skipped if they do not exist)
app.admin.default-usernames=${DEFAULT_ADMINS:}