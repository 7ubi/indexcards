version: '3'

# Rotate container logs (incl. nginx access logs with IP addresses): at most 3 x 10 MB per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  mysqldb:
    container_name: dbcontainer
    logging: *default-logging
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: 'indexcardsdb'
      # Password for root access
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
    networks:
      - springmysql-net
    ports:
      - '3306:3306'
    restart: always
    volumes:
      - my-db:/var/lib/mysql
  backend:
    container_name: backendcontainer
    logging: *default-logging
    build: ./indexcards
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/indexcardsdb?createDatabaseIfNotExist=true&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: 'root'
      SPRING_DATASOURCE_PASSWORD: '${DB_PASSWORD}'
      # Tokens are issued by Authentik. The issuer is the public URL (must match the token's `iss`); keys are fetched
      # over the internal network.
      AUTHENTIK_ISSUER: '${AUTHENTIK_URL:?AUTHENTIK_URL is required}/application/o/indexcards/'
      AUTHENTIK_JWKS_URI: 'http://authentikservercontainer:9000/application/o/indexcards/jwks/'
      AUTHENTIK_CLIENT_ID: 'indexcards'
      # Deletes the Authentik user when an account is deleted (service account "indexcards-backend" from the blueprint).
      AUTHENTIK_API_URL: 'http://authentikservercontainer:9000/api/v3'
      AUTHENTIK_API_TOKEN: '${AUTHENTIK_API_TOKEN:?AUTHENTIK_API_TOKEN is required}'
    volumes:
      - './indexcards:/usr/src/app'
      - image-storage:/app/data/images
    ports:
      - '8081:8080'
    networks:
      - springmysql-net
      - backend
      - nginx_backend
    restart: always
    depends_on:
      - mysqldb
      - authentik-server
  frontend:
    container_name: frontendcontainer
    logging: *default-logging
    build: ./indexcards-ui
    volumes:
      - './indexcards-ui:/usr/src/app'
    restart: always
    depends_on:
      - backend
    networks:
      - backend
      - nginx_backend
    ports:
      - '4200:80'
  authentik-db:
    container_name: authentikdbcontainer
    logging: *default-logging
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: 'authentik'
      POSTGRES_USER: 'authentik'
      POSTGRES_PASSWORD: '${AUTHENTIK_PG_PASSWORD}'
    networks:
      - authentik-net
    restart: always
    volumes:
      - authentik-db:/var/lib/postgresql/data
  authentik-server:
    container_name: authentikservercontainer
    logging: *default-logging
    # 2025.10+ no longer needs Redis. When pinning an older version, add a redis service and AUTHENTIK_REDIS__HOST.
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2025.10}
    command: server
    environment: &authentik-environment
      AUTHENTIK_SECRET_KEY: '${AUTHENTIK_SECRET_KEY}'
      AUTHENTIK_POSTGRESQL__HOST: 'authentik-db'
      AUTHENTIK_POSTGRESQL__NAME: 'authentik'
      AUTHENTIK_POSTGRESQL__USER: 'authentik'
      AUTHENTIK_POSTGRESQL__PASSWORD: '${AUTHENTIK_PG_PASSWORD}'
      # Only used on the very first start to create the admin user "akadmin".
      AUTHENTIK_BOOTSTRAP_PASSWORD: '${AUTHENTIK_BOOTSTRAP_PASSWORD}'
      AUTHENTIK_BOOTSTRAP_EMAIL: '${AUTHENTIK_BOOTSTRAP_EMAIL}'
      # Read by authentik/blueprints/indexcards.yaml
      GOOGLE_CLIENT_ID: '${GOOGLE_CLIENT_ID}'
      GOOGLE_CLIENT_SECRET: '${GOOGLE_CLIENT_SECRET}'
      INDEXCARDS_URL: '${INDEXCARDS_URL:?INDEXCARDS_URL is required}'
      AUTHENTIK_API_TOKEN: '${AUTHENTIK_API_TOKEN:?AUTHENTIK_API_TOKEN is required}'
    volumes:
      - './authentik/blueprints:/blueprints/custom'
    ports:
      - '127.0.0.1:9000:9000'
    networks:
      - authentik-net
      - backend
      - nginx_backend
    restart: always
    depends_on:
      - authentik-db
  authentik-worker:
    container_name: authentikworkercontainer
    logging: *default-logging
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2025.10}
    command: worker
    environment: *authentik-environment
    volumes:
      - './authentik/blueprints:/blueprints/custom'
    networks:
      - authentik-net
    restart: always
    depends_on:
      - authentik-db

networks:
  springmysql-net:
  backend:
  authentik-net:
  nginx_backend:
    external: true


volumes:
  my-db:
  image-storage:
  authentik-db:
