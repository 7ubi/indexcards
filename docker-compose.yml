version: '3'

# Rotate container logs (incl. nginx access logs with IP addresses): at most 3 x 10 MB per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  mysqldb:
    container_name: dbcontainer
    logging: *default-logging
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: 'indexcardsdb'
      # Password for root access
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
    networks:
      - springmysql-net
    ports:
      - '3306:3306'
    restart: always
    volumes:
      - my-db:/var/lib/mysql
  backend:
    container_name: backendcontainer
    logging: *default-logging
    build: ./indexcards
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/indexcardsdb?createDatabaseIfNotExist=true&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: 'root'
      SPRING_DATASOURCE_PASSWORD: '${DB_PASSWORD}'
      # Base64-encoded JWT signing key (set in .env, e.g. `openssl rand -base64 64 | tr -d '\n'`)
      JWT_SECRET: '${JWT_SECRET}'
    volumes:
      - './indexcards:/usr/src/app'
      - image-storage:/app/data/images
    ports:
      - '8081:8080'
    networks:
      - springmysql-net
      - backend
      - nginx_backend
    restart: always
    depends_on:
      - mysqldb
  frontend:
    container_name: frontendcontainer
    logging: *default-logging
    build: ./indexcards-ui
    volumes:
      - './indexcards-ui:/usr/src/app'
    restart: always
    depends_on:
      - backend
    networks:
      - backend
      - nginx_backend
    ports:
      - '4200:80'

networks:
  springmysql-net:
  backend:
  nginx_backend:
    external: true


volumes:
  my-db:
  image-storage: