# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: indexcard pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build and Test with Maven
        run: mvn -B package --file indexcards/pom.xml
  linting:
    name: Linting # job name (unique id)
    runs-on: ubuntu-latest # on which machine to run
    steps: # list of steps
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: indexcards-ui/package-lock.json

      - name: Install Dependencies
        run: cd indexcards-ui && npm ci

      - name: Code Linting
        run: cd indexcards-ui && npm run lint

      - name: Code Formatting
        run: cd indexcards-ui && npm run format:check
  deploy:
    name: Deployment
    runs-on: self-hosted
    if: github.event_name != 'pull_request'
    needs:
      - build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        if: github.event_name != 'pull_request'
      - name: Start docker-compose
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AUTHENTIK_SECRET_KEY: ${{ secrets.AUTHENTIK_SECRET_KEY }}
          AUTHENTIK_PG_PASSWORD: ${{ secrets.AUTHENTIK_PG_PASSWORD }}
          AUTHENTIK_BOOTSTRAP_PASSWORD: ${{ secrets.AUTHENTIK_BOOTSTRAP_PASSWORD }}
          AUTHENTIK_BOOTSTRAP_EMAIL: ${{ secrets.AUTHENTIK_BOOTSTRAP_EMAIL }}
          AUTHENTIK_URL: ${{ vars.AUTHENTIK_URL }}
          AUTHENTIK_API_TOKEN: ${{ secrets.AUTHENTIK_API_TOKEN }}
          INDEXCARDS_URL: ${{ vars.INDEXCARDS_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          docker-compose down
          docker-compose up --build -d
  documentation:
    name: Deploy documentation
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    needs:
      - deploy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Start docker-compose
        run: |
          cd indexcards-docu
          docker-compose down
          docker-compose up --build -d