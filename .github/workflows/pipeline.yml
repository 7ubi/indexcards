# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: indexcard pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Backend - Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build and Test with Maven
        run: mvn -B package --file indexcards/pom.xml
  frontend:
    name: Frontend - Lint, Test and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexcards-ui
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          # Same major version as the frontend Dockerfile
          node-version: 24
          cache: 'npm'
          cache-dependency-path: indexcards-ui/package-lock.json

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Code Linting
        run: npm run lint

      - name: Code Formatting
        run: npm run format:check

      - name: Unit Tests
        run: npm test -- --watch=false

      - name: Production Build
        run: npm run build
  docker:
    name: Docker - Validate Compose and Build Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        env:
          AUTHENTIK_URL: https://auth.example.com
          AUTHENTIK_API_TOKEN: ci
          INDEXCARDS_URL: https://indexcards.example.com
        run: docker compose config --quiet
      - name: Build images
        run: |
          docker build -t indexcards-backend ./indexcards
          docker build -t indexcards-frontend ./indexcards-ui
  deploy:
    name: Deployment
    runs-on: self-hosted
    if: github.event_name != 'pull_request'
    needs:
      - build
      - frontend
      - docker
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Start docker-compose
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AUTHENTIK_SECRET_KEY: ${{ secrets.AUTHENTIK_SECRET_KEY }}
          AUTHENTIK_PG_PASSWORD: ${{ secrets.AUTHENTIK_PG_PASSWORD }}
          AUTHENTIK_BOOTSTRAP_PASSWORD: ${{ secrets.AUTHENTIK_BOOTSTRAP_PASSWORD }}
          AUTHENTIK_BOOTSTRAP_EMAIL: ${{ secrets.AUTHENTIK_BOOTSTRAP_EMAIL }}
          AUTHENTIK_URL: ${{ vars.AUTHENTIK_URL }}
          AUTHENTIK_API_TOKEN: ${{ secrets.AUTHENTIK_API_TOKEN }}
          INDEXCARDS_URL: ${{ vars.INDEXCARDS_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          docker-compose down
          docker-compose up --build -d
      - name: Wait for healthy containers
        run: |
          # Fails the deployment if a container does not become healthy within 5 minutes.
          for i in $(seq 1 60); do
            unhealthy=$(for c in dbcontainer backendcontainer frontendcontainer authentikdbcontainer authentikservercontainer authentikworkercontainer; do
              [ "$(docker inspect -f '{{.State.Health.Status}}' "$c" 2>/dev/null)" = healthy ] || echo "$c"
            done)
            if [ -z "$unhealthy" ]; then
              echo "All containers are healthy"
              exit 0
            fi
            echo "Waiting for: $unhealthy"
            sleep 5
          done
          docker-compose ps
          docker-compose logs --tail=100 backend frontend
          exit 1
  documentation:
    name: Deploy documentation
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Dependencies
        run: pip install -r indexcards-docu/requirements.txt
      - name: Deploy to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force --config-file indexcards-docu/mkdocs.yml
