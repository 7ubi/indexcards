# Applied automatically by the Authentik worker (mounted to /blueprints/custom). Values come from environment variables
# of the Authentik containers, see docker-compose.yml.
version: 1
metadata:
  name: indexcards
  labels:
    blueprints.goauthentik.io/description: Indexcards app with username/password and Google login
entries:
  # Google login. New users are enrolled by the default source enrollment flow (asks for a username once).
  # Google accounts and username/password accounts are never linked automatically (default user matching mode).
  - model: authentik_sources_oauth.oauthsource
    id: google-source
    identifiers:
      slug: google
    attrs:
      name: Google
      provider_type: google
      consumer_key: !Env GOOGLE_CLIENT_ID
      consumer_secret: !Env GOOGLE_CLIENT_SECRET
      authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
      enrollment_flow: !Find [authentik_flows.flow, [slug, default-source-enrollment]]

  # --- Username/password accounts, stored in Authentik ---
  # No email address is collected, so there is no email verification and no self-service password reset. An admin
  # can create a recovery link for a user in the Authentik admin interface (Directory → Users).
  - model: authentik_policies_password.passwordpolicy
    id: indexcards-password-policy
    identifiers:
      name: indexcards-password-policy
    attrs:
      password_field: password
      check_static_rules: true
      length_min: 10
      error_message: The password must be at least 10 characters long.
      check_have_i_been_pwned: false
      check_zxcvbn: false

  - model: authentik_stages_prompt.prompt
    id: indexcards-prompt-username
    identifiers:
      name: indexcards-enrollment-username
    attrs:
      field_key: username
      label: Username
      type: username
      required: true
      placeholder: Username
      placeholder_expression: false
      order: 0

  - model: authentik_stages_prompt.prompt
    id: indexcards-prompt-name
    identifiers:
      name: indexcards-enrollment-name
    attrs:
      field_key: name
      label: Name
      type: text
      required: true
      placeholder: First and last name
      placeholder_expression: false
      order: 1

  - model: authentik_stages_prompt.prompt
    id: indexcards-prompt-password
    identifiers:
      name: indexcards-enrollment-password
    attrs:
      field_key: password
      label: Password
      type: password
      required: true
      placeholder: Password
      placeholder_expression: false
      order: 2

  # Authentik checks that the fields "password" and "password_repeat" match.
  - model: authentik_stages_prompt.prompt
    id: indexcards-prompt-password-repeat
    identifiers:
      name: indexcards-enrollment-password-repeat
    attrs:
      field_key: password_repeat
      label: Password (repeat)
      type: password
      required: true
      placeholder: Password (repeat)
      placeholder_expression: false
      order: 3

  - model: authentik_stages_prompt.promptstage
    id: indexcards-enrollment-prompt-stage
    identifiers:
      name: indexcards-enrollment-prompt
    attrs:
      fields:
        - !KeyOf indexcards-prompt-username
        - !KeyOf indexcards-prompt-name
        - !KeyOf indexcards-prompt-password
        - !KeyOf indexcards-prompt-password-repeat
      validation_policies:
        - !KeyOf indexcards-password-policy

  - model: authentik_stages_user_write.userwritestage
    id: indexcards-enrollment-user-write-stage
    identifiers:
      name: indexcards-enrollment-user-write
    attrs:
      user_creation_mode: always_create
      create_users_as_inactive: false

  - model: authentik_stages_user_login.userloginstage
    id: indexcards-login-stage
    identifiers:
      name: indexcards-login

  - model: authentik_stages_password.passwordstage
    id: indexcards-password-stage
    identifiers:
      name: indexcards-password
    attrs:
      backends:
        - authentik.core.auth.InbuiltBackend
      failed_attempts_before_cancel: 5

  # Signup: username, name, password -> create the user -> log them in.
  - model: authentik_flows.flow
    id: indexcards-enrollment-flow
    identifiers:
      slug: indexcards-enrollment
    attrs:
      name: Indexcards signup
      title: Create an Indexcards account
      designation: enrollment

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf indexcards-enrollment-flow
      stage: !KeyOf indexcards-enrollment-prompt-stage
      order: 10

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf indexcards-enrollment-flow
      stage: !KeyOf indexcards-enrollment-user-write-stage
      order: 20

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf indexcards-enrollment-flow
      stage: !KeyOf indexcards-login-stage
      order: 30

  # --- Login flow used only for Indexcards ---
  # One page with username + password, a "Google" button and a "Sign up" link.
  # The Authentik admin interface keeps using the default authentication flow.
  - model: authentik_flows.flow
    id: indexcards-authentication-flow
    identifiers:
      slug: indexcards-authentication
    attrs:
      name: Indexcards login
      title: Sign in to Indexcards
      designation: authentication

  - model: authentik_stages_identification.identificationstage
    id: indexcards-identification-stage
    identifiers:
      name: indexcards-identification
    attrs:
      user_fields:
        - username
      password_stage: !KeyOf indexcards-password-stage
      enrollment_flow: !KeyOf indexcards-enrollment-flow
      sources:
        - !KeyOf google-source
      show_source_labels: true

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf indexcards-authentication-flow
      stage: !KeyOf indexcards-identification-stage
      order: 10

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf indexcards-authentication-flow
      stage: !KeyOf indexcards-login-stage
      order: 20

  # --- Logout: end the Authentik session and go back to the app ---
  # Authentik ignores the post_logout_redirect_uri the app sends, so the provider gets its own invalidation flow that
  # logs out and then redirects to the app's login page.
  - model: authentik_flows.flow
    id: indexcards-invalidation-flow
    identifiers:
      slug: indexcards-invalidation
    attrs:
      name: Indexcards logout
      title: Logged out of Indexcards
      designation: invalidation
      authentication: none

  - model: authentik_stages_user_logout.userlogoutstage
    id: indexcards-logout-stage
    identifiers:
      name: indexcards-logout

  - model: authentik_stages_redirect.redirectstage
    id: indexcards-logout-redirect-stage
    identifiers:
      name: indexcards-logout-redirect
    attrs:
      mode: static
      target_static: !Format ["%s/login", !Env INDEXCARDS_URL]
      keep_context: false

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf indexcards-invalidation-flow
      stage: !KeyOf indexcards-logout-stage
      order: 10

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf indexcards-invalidation-flow
      stage: !KeyOf indexcards-logout-redirect-stage
      order: 20

  # Public client (SPA with PKCE, no client secret). Access tokens are JWTs signed with the self-signed key (RS256).
  - model: authentik_providers_oauth2.oauth2provider
    id: indexcards-provider
    identifiers:
      client_id: indexcards
    attrs:
      name: Indexcards
      client_type: public
      authentication_flow: !KeyOf indexcards-authentication-flow
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !KeyOf indexcards-invalidation-flow
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/login/callback", !Env INDEXCARDS_URL]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # Same lifetime as the app's former own token.
      access_token_validity: hours=24
      # The subject is the Authentik user's UUID, so the backend can find the user through the API to delete it.
      sub_mode: user_uuid
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    identifiers:
      slug: indexcards
    attrs:
      name: Indexcards
      provider: !KeyOf indexcards-provider
      meta_launch_url: !Env INDEXCARDS_URL

  # Members get the admin role in the app on their next request (the profile scope sends group names in the `groups`
  # claim). Only Authentik admins can change memberships. No members are created here; add them under
  # Directory → Groups. This group gives no rights inside Authentik itself.
  - model: authentik_core.group
    identifiers:
      name: indexcards-admins
    attrs:
      name: indexcards-admins
      is_superuser: false

  # --- Backend access to the Authentik API ---
  # The backend deletes a user's Authentik account when they delete their Indexcards account. The role only allows
  # viewing and deleting users; the token key comes from the environment.
  - model: authentik_rbac.role
    id: indexcards-backend-role
    identifiers:
      name: indexcards-backend
    attrs:
      permissions:
        - authentik_core.view_user
        - authentik_core.delete_user

  - model: authentik_core.group
    id: indexcards-backend-group
    identifiers:
      name: indexcards-backend
    attrs:
      name: indexcards-backend
      is_superuser: false
      roles:
        - !KeyOf indexcards-backend-role

  - model: authentik_core.user
    id: indexcards-backend-user
    identifiers:
      username: indexcards-backend
    attrs:
      name: Indexcards backend
      type: service_account
      groups:
        - !KeyOf indexcards-backend-group

  - model: authentik_core.token
    identifiers:
      identifier: indexcards-backend-api
    attrs:
      user: !KeyOf indexcards-backend-user
      intent: api
      expiring: false
      key: !Env AUTHENTIK_API_TOKEN
      description: Indexcards backend (deletes users together with their app account)
