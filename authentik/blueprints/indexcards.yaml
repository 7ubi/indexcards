# Applied automatically by the Authentik worker (mounted to /blueprints/custom). Values come from environment variables
# of the Authentik containers, see docker-compose.yml.
version: 1
metadata:
  name: indexcards
  labels:
    blueprints.goauthentik.io/description: Indexcards app with username/password and Google login
entries:
  # Google login. New users are enrolled by the default source enrollment flow (asks for a username once).
  # Google accounts and username/password accounts are never linked automatically (default user matching mode).
  - model: authentik_sources_oauth.oauthsource
    id: google-source
    identifiers:
      slug: google
    attrs:
      name: Google
      provider_type: google
      consumer_key: !Env GOOGLE_CLIENT_ID
      consumer_secret: !Env GOOGLE_CLIENT_SECRET
      authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
      enrollment_flow: !Find [authentik_flows.flow, [slug, default-source-enrollment]]

  # --- Username/password accounts, stored in Authentik ---
  # Every account needs an email address: signup asks for one and only activates the account once it is confirmed via
  # the link sent to it. Accounts created before that are asked for an address on their next login. There is no
  # self-service password reset yet; an admin can create a recovery link in the Authentik admin interface
  # (Directory → Users).
  - model: authentik_policies_password.passwordpolicy
    id: indexcards-password-policy
    identifiers:
      name: indexcards-password-policy
    attrs:
      password_field: password
      check_static_rules: true
      length_min: 10
      error_message: The password must be at least 10 characters long.
      check_have_i_been_pwned: false
      check_zxcvbn: false

  - model: authentik_stages_prompt.prompt
    id: indexcards-prompt-username
    identifiers:
      name: indexcards-enrollment-username
    attrs:
      field_key: username
      label: Username
      type: username
      required: true
      placeholder: Username
      placeholder_expression: false
      order: 0

  - model: authentik_stages_prompt.prompt
    id: indexcards-prompt-name
    identifiers:
      name: indexcards-enrollment-name
    attrs:
      field_key: name
      label: Name
      type: text
      required: true
      placeholder: First and last name
      placeholder_expression: false
      order: 1

  - model: authentik_stages_prompt.prompt
    id: indexcards-prompt-email
    identifiers:
      name: indexcards-enrollment-email
    attrs:
      field_key: email
      label: Email
      type: email
      required: true
      placeholder: Email
      placeholder_expression: false
      order: 2

  # Email addresses are unique (case-insensitive), so an address always identifies one account.
  - model: authentik_policies_expression.expressionpolicy
    id: indexcards-email-unique-policy
    identifiers:
      name: indexcards-email-unique
    attrs:
      expression: |
        from authentik.core.models import User

        email = request.context.get("prompt_data", {}).get("email", "")
        if User.objects.filter(email__iexact=email).exclude(pk=request.user.pk).exists():
            ak_message("This email address is already used by another account.")
            return False
        return True

  - model: authentik_stages_prompt.prompt
    id: indexcards-prompt-password
    identifiers:
      name: indexcards-enrollment-password
    attrs:
      field_key: password
      label: Password
      type: password
      required: true
      placeholder: Password
      placeholder_expression: false
      order: 3

  # Authentik checks that the fields "password" and "password_repeat" match.
  - model: authentik_stages_prompt.prompt
    id: indexcards-prompt-password-repeat
    identifiers:
      name: indexcards-enrollment-password-repeat
    attrs:
      field_key: password_repeat
      label: Password (repeat)
      type: password
      required: true
      placeholder: Password (repeat)
      placeholder_expression: false
      order: 4

  - model: authentik_stages_prompt.promptstage
    id: indexcards-enrollment-prompt-stage
    identifiers:
      name: indexcards-enrollment-prompt
    attrs:
      fields:
        - !KeyOf indexcards-prompt-username
        - !KeyOf indexcards-prompt-name
        - !KeyOf indexcards-prompt-email
        - !KeyOf indexcards-prompt-password
        - !KeyOf indexcards-prompt-password-repeat
      validation_policies:
        - !KeyOf indexcards-password-policy
        - !KeyOf indexcards-email-unique-policy

  - model: authentik_stages_user_write.userwritestage
    id: indexcards-enrollment-user-write-stage
    identifiers:
      name: indexcards-enrollment-user-write
    attrs:
      user_creation_mode: always_create
      # Activated by the email stage once the address is confirmed.
      create_users_as_inactive: true

  # Sends a confirmation link via the global email settings (Resend, see docker-compose.yml). Opening it continues the
  # flow and activates the user.
  - model: authentik_stages_email.emailstage
    id: indexcards-email-confirmation-stage
    identifiers:
      name: indexcards-email-confirmation
    attrs:
      use_global_settings: true
      subject: Confirm your email address for Indexcards
      template: email/account_confirmation.html
      token_expiry: hours=24
      activate_user_on_success: true

  - model: authentik_stages_user_login.userloginstage
    id: indexcards-login-stage
    identifiers:
      name: indexcards-login

  - model: authentik_stages_password.passwordstage
    id: indexcards-password-stage
    identifiers:
      name: indexcards-password
    attrs:
      backends:
        - authentik.core.auth.InbuiltBackend
      failed_attempts_before_cancel: 5

  # Signup: username, name, email, password -> create the (inactive) user -> confirm the email -> log them in.
  - model: authentik_flows.flow
    id: indexcards-enrollment-flow
    identifiers:
      slug: indexcards-enrollment
    attrs:
      name: Indexcards signup
      title: Create an Indexcards account
      designation: enrollment

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf indexcards-enrollment-flow
      stage: !KeyOf indexcards-enrollment-prompt-stage
      order: 10

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf indexcards-enrollment-flow
      stage: !KeyOf indexcards-enrollment-user-write-stage
      order: 20

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf indexcards-enrollment-flow
      stage: !KeyOf indexcards-email-confirmation-stage
      order: 25

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf indexcards-enrollment-flow
      stage: !KeyOf indexcards-login-stage
      order: 30

  # --- Login flow used only for Indexcards ---
  # One page with username + password, a "Google" button and a "Sign up" link.
  # The Authentik admin interface keeps using the default authentication flow.
  - model: authentik_flows.flow
    id: indexcards-authentication-flow
    identifiers:
      slug: indexcards-authentication
    attrs:
      name: Indexcards login
      title: Sign in to Indexcards
      designation: authentication
      # A user who is already logged in skips the flow and goes straight to `?next=` (used by the 2FA setup links).
      authentication: require_unauthenticated

  - model: authentik_stages_identification.identificationstage
    id: indexcards-identification-stage
    identifiers:
      name: indexcards-identification
    attrs:
      user_fields:
        - username
      password_stage: !KeyOf indexcards-password-stage
      enrollment_flow: !KeyOf indexcards-enrollment-flow
      sources:
        - !KeyOf google-source
      show_source_labels: true

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf indexcards-authentication-flow
      stage: !KeyOf indexcards-identification-stage
      order: 10

  # Accounts without an email address (created before it was required) enter and confirm one before they are logged
  # in. The user is only known after the identification stage, so these bindings are evaluated when they are reached.
  - model: authentik_policies_expression.expressionpolicy
    id: indexcards-email-missing-policy
    identifiers:
      name: indexcards-email-missing
    attrs:
      expression: |
        return not request.user.email

  - model: authentik_policies_expression.expressionpolicy
    id: indexcards-email-entered-policy
    identifiers:
      name: indexcards-email-entered
    attrs:
      expression: |
        return bool(request.context.get("prompt_data", {}).get("email"))

  - model: authentik_stages_prompt.promptstage
    id: indexcards-add-email-prompt-stage
    identifiers:
      name: indexcards-add-email-prompt
    attrs:
      fields:
        - !KeyOf indexcards-prompt-email
      validation_policies:
        - !KeyOf indexcards-email-unique-policy

  - model: authentik_stages_user_write.userwritestage
    id: indexcards-add-email-user-write-stage
    identifiers:
      name: indexcards-add-email-user-write
    attrs:
      user_creation_mode: never_create

  - model: authentik_flows.flowstagebinding
    id: indexcards-add-email-prompt-binding
    identifiers:
      target: !KeyOf indexcards-authentication-flow
      stage: !KeyOf indexcards-add-email-prompt-stage
      order: 12
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true

  - model: authentik_flows.flowstagebinding
    id: indexcards-add-email-user-write-binding
    identifiers:
      target: !KeyOf indexcards-authentication-flow
      stage: !KeyOf indexcards-add-email-user-write-stage
      order: 14
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true

  - model: authentik_flows.flowstagebinding
    id: indexcards-add-email-confirmation-binding
    identifiers:
      target: !KeyOf indexcards-authentication-flow
      stage: !KeyOf indexcards-email-confirmation-stage
      order: 16
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true

  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf indexcards-email-missing-policy
      target: !KeyOf indexcards-add-email-prompt-binding
      order: 0

  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf indexcards-email-entered-policy
      target: !KeyOf indexcards-add-email-user-write-binding
      order: 0

  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf indexcards-email-entered-policy
      target: !KeyOf indexcards-add-email-confirmation-binding
      order: 0

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf indexcards-authentication-flow
      stage: !KeyOf indexcards-login-stage
      order: 20

  # --- Two-factor authentication (optional) ---
  # Users add an authenticator app, a passkey/security key, email codes or recovery codes on the app's account page,
  # which opens the
  # matching setup flow below through the login flow (`/if/flow/indexcards-authentication/?next=/if/flow/<slug>/`), so
  # an expired Authentik session logs in first. Each setup flow returns to the account page. The backend lists and
  # removes the devices through the API (service account "indexcards-backend").
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: indexcards-mfa-validation-stage
    identifiers:
      name: indexcards-mfa-validation
    attrs:
      device_classes:
        - totp
        - webauthn
        - email
        - static
      # 2FA is optional: users without a device log in with their password only.
      not_configured_action: skip
      last_auth_threshold: seconds=0
      webauthn_user_verification: preferred

  # Checked right after the password, before anything else happens in the login flow.
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf indexcards-authentication-flow
      stage: !KeyOf indexcards-mfa-validation-stage
      order: 11

  # Returns to the app's account page once a setup flow is finished. This sets the plan's `redirect` (honoured when the
  # flow completes) instead of ending with a redirect stage: a redirect stage never completes its flow, and the plan
  # left in the session makes Authentik's end-session endpoint show only "Logout successful" on the next logout.
  # Bound with evaluate_on_plan false / re_evaluate_policies true, so it runs uncached on the live plan.
  - model: authentik_policies_expression.expressionpolicy
    id: indexcards-redirect-to-account-policy
    identifiers:
      name: indexcards-redirect-to-account
    attrs:
      expression: !Format
        - |
          context["flow_plan"].context["redirect"] = "%s/account"
          return True
        - !Env INDEXCARDS_URL

  # Former redirect stage of the setup flows (see above).
  - model: authentik_stages_redirect.redirectstage
    state: absent
    identifiers:
      name: indexcards-account-redirect

  - model: authentik_flows.flow
    id: indexcards-mfa-totp-setup-flow
    identifiers:
      slug: indexcards-mfa-totp-setup
    attrs:
      name: Indexcards authenticator app setup
      title: Set up an authenticator app
      designation: stage_configuration
      authentication: require_authenticated

  - model: authentik_stages_authenticator_totp.authenticatortotpstage
    id: indexcards-mfa-totp-setup-stage
    identifiers:
      name: indexcards-mfa-totp-setup
    attrs:
      digits: 6
      friendly_name: Authenticator app
      configure_flow: !KeyOf indexcards-mfa-totp-setup-flow

  - model: authentik_flows.flowstagebinding
    id: indexcards-mfa-totp-setup-binding
    identifiers:
      target: !KeyOf indexcards-mfa-totp-setup-flow
      stage: !KeyOf indexcards-mfa-totp-setup-stage
      order: 10
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true

  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf indexcards-redirect-to-account-policy
      target: !KeyOf indexcards-mfa-totp-setup-binding
      order: 0

  - model: authentik_flows.flow
    id: indexcards-mfa-webauthn-setup-flow
    identifiers:
      slug: indexcards-mfa-webauthn-setup
    attrs:
      name: Indexcards passkey setup
      title: Set up a passkey or security key
      designation: stage_configuration
      authentication: require_authenticated

  - model: authentik_stages_authenticator_webauthn.authenticatorwebauthnstage
    id: indexcards-mfa-webauthn-setup-stage
    identifiers:
      name: indexcards-mfa-webauthn-setup
    attrs:
      friendly_name: Passkey or security key
      user_verification: preferred
      resident_key_requirement: preferred
      configure_flow: !KeyOf indexcards-mfa-webauthn-setup-flow

  - model: authentik_flows.flowstagebinding
    id: indexcards-mfa-webauthn-setup-binding
    identifiers:
      target: !KeyOf indexcards-mfa-webauthn-setup-flow
      stage: !KeyOf indexcards-mfa-webauthn-setup-stage
      order: 10
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true

  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf indexcards-redirect-to-account-policy
      target: !KeyOf indexcards-mfa-webauthn-setup-binding
      order: 0

  - model: authentik_flows.flow
    id: indexcards-mfa-email-setup-flow
    identifiers:
      slug: indexcards-mfa-email-setup
    attrs:
      name: Indexcards email code setup
      title: Set up sign-in codes by email
      designation: stage_configuration
      authentication: require_authenticated

  # Sends the codes to the account's (confirmed) email address via the global email settings.
  - model: authentik_stages_authenticator_email.authenticatoremailstage
    id: indexcards-mfa-email-setup-stage
    identifiers:
      name: indexcards-mfa-email-setup
    attrs:
      friendly_name: Email code
      use_global_settings: true
      subject: Your Indexcards sign-in code
      token_expiry: minutes=15
      configure_flow: !KeyOf indexcards-mfa-email-setup-flow

  - model: authentik_flows.flowstagebinding
    id: indexcards-mfa-email-setup-binding
    identifiers:
      target: !KeyOf indexcards-mfa-email-setup-flow
      stage: !KeyOf indexcards-mfa-email-setup-stage
      order: 10
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true

  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf indexcards-redirect-to-account-policy
      target: !KeyOf indexcards-mfa-email-setup-binding
      order: 0

  # Recovery codes: one-time codes shown once during setup, for logging in when the other factors are not at hand.
  # Each code is deleted when used.
  - model: authentik_flows.flow
    id: indexcards-mfa-static-setup-flow
    identifiers:
      slug: indexcards-mfa-static-setup
    attrs:
      name: Indexcards recovery codes setup
      title: Save your recovery codes
      designation: stage_configuration
      authentication: require_authenticated

  - model: authentik_stages_authenticator_static.authenticatorstaticstage
    id: indexcards-mfa-static-setup-stage
    identifiers:
      name: indexcards-mfa-static-setup
    attrs:
      friendly_name: Recovery codes
      token_count: 10
      token_length: 12
      configure_flow: !KeyOf indexcards-mfa-static-setup-flow

  - model: authentik_flows.flowstagebinding
    id: indexcards-mfa-static-setup-binding
    identifiers:
      target: !KeyOf indexcards-mfa-static-setup-flow
      stage: !KeyOf indexcards-mfa-static-setup-stage
      order: 10
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true

  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf indexcards-redirect-to-account-policy
      target: !KeyOf indexcards-mfa-static-setup-binding
      order: 0

  # Google logins use Authentik's default source authentication flow; a second factor set up for such an account is
  # checked there too.
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-source-authentication]]
      stage: !KeyOf indexcards-mfa-validation-stage
      order: -10

  # --- Logout: end the Authentik session and go back to the app ---
  # Authentik ignores the post_logout_redirect_uri the app sends, so the provider gets its own invalidation flow that
  # logs out and then redirects to the app's login page.
  - model: authentik_flows.flow
    id: indexcards-invalidation-flow
    identifiers:
      slug: indexcards-invalidation
    attrs:
      name: Indexcards logout
      title: Logged out of Indexcards
      designation: invalidation
      authentication: none

  - model: authentik_stages_user_logout.userlogoutstage
    id: indexcards-logout-stage
    identifiers:
      name: indexcards-logout

  - model: authentik_stages_redirect.redirectstage
    id: indexcards-logout-redirect-stage
    identifiers:
      name: indexcards-logout-redirect
    attrs:
      mode: static
      target_static: !Format ["%s/login", !Env INDEXCARDS_URL]
      keep_context: false

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf indexcards-invalidation-flow
      stage: !KeyOf indexcards-logout-stage
      order: 10

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf indexcards-invalidation-flow
      stage: !KeyOf indexcards-logout-redirect-stage
      order: 20

  # Public client (SPA with PKCE, no client secret). Access tokens are JWTs signed with the self-signed key (RS256).
  - model: authentik_providers_oauth2.oauth2provider
    id: indexcards-provider
    identifiers:
      client_id: indexcards
    attrs:
      name: Indexcards
      client_type: public
      authentication_flow: !KeyOf indexcards-authentication-flow
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !KeyOf indexcards-invalidation-flow
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/login/callback", !Env INDEXCARDS_URL]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # Same lifetime as the app's former own token.
      access_token_validity: hours=24
      # The subject is the Authentik user's UUID, so the backend can find the user through the API to delete it.
      sub_mode: user_uuid
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    identifiers:
      slug: indexcards
    attrs:
      name: Indexcards
      provider: !KeyOf indexcards-provider
      meta_launch_url: !Env INDEXCARDS_URL

  # Members get the admin role in the app on their next request (the profile scope sends group names in the `groups`
  # claim). Only Authentik admins can change memberships. No members are created here; add them under
  # Directory → Groups. This group gives no rights inside Authentik itself.
  - model: authentik_core.group
    identifiers:
      name: indexcards-admins
    attrs:
      name: indexcards-admins
      is_superuser: false

  # --- Backend access to the Authentik API ---
  # The backend deletes a user's Authentik account when they delete their Indexcards account, and lists and removes
  # their 2FA devices on the account page. The role only allows viewing and deleting users and these devices; the token
  # key comes from the environment.
  - model: authentik_rbac.role
    id: indexcards-backend-role
    identifiers:
      name: indexcards-backend
    attrs:
      permissions:
        - authentik_core.view_user
        - authentik_core.delete_user
        - authentik_stages_authenticator_totp.view_totpdevice
        - authentik_stages_authenticator_totp.delete_totpdevice
        - authentik_stages_authenticator_webauthn.view_webauthndevice
        - authentik_stages_authenticator_webauthn.delete_webauthndevice
        - authentik_stages_authenticator_email.view_emaildevice
        - authentik_stages_authenticator_email.delete_emaildevice
        - authentik_stages_authenticator_static.view_staticdevice
        - authentik_stages_authenticator_static.delete_staticdevice

  - model: authentik_core.group
    id: indexcards-backend-group
    identifiers:
      name: indexcards-backend
    attrs:
      name: indexcards-backend
      is_superuser: false
      roles:
        - !KeyOf indexcards-backend-role

  - model: authentik_core.user
    id: indexcards-backend-user
    identifiers:
      username: indexcards-backend
    attrs:
      name: Indexcards backend
      type: service_account
      groups:
        - !KeyOf indexcards-backend-group

  - model: authentik_core.token
    identifiers:
      identifier: indexcards-backend-api
    attrs:
      user: !KeyOf indexcards-backend-user
      intent: api
      expiring: false
      key: !Env AUTHENTIK_API_TOKEN
      description: Indexcards backend (deletes users together with their app account, manages their 2FA devices)
